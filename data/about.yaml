principles:
  - title: Everything in Git
    text: If a platform can't be rebuilt from a repository on a bad day, it isn't finished. Configuration, pipelines and documentation all live in version control.
  - title: Try it before recommending it
    text: I run a home lab where I test designs on real hardware first, so what I propose to a client has already been rebuilt and broken at least once.
  - title: Write down the why
    text: A runbook says what to type. I also record why a choice was made, so the next person can change it safely.
